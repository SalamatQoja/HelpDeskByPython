{% extends "users/admin_dashboard.html" %}

{% load static %}
{% block password_change_content %}

<div class="password-change">
    <h2 class="password-change-title">Изменение пароль</h2>
    <hr style="width: 90%">
    <form method="post" class="password-change-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="password-change-btn">Изменить пароль</button>
    </form>
</div>

{% endblock %}
